title: Marc Galbraith
tagline: Engineering leader and senior software engineer
url: https://www.marcgalbraith.com
email: marc.s.galbraith@gmail.com
description: >-
  Marc Galbraith is a Melbourne-based engineering leader and senior software
  engineer with 20+ years across software, organisational design and
  enterprise transformation.

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock

base_url: '/'
excerpt_separator: ""
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-redirect-from
  
# Define Jekyll collections
collections:
  # Define a collection named "resume", its documents reside in the "_resume" directory
  resume:
    permalink: "/:collection/:path/"
    output: true

# Footer links
social:
  - { name: Email, url: "mailto:marc.s.galbraith@gmail.com" }
  - { name: LinkedIn, url: "https://www.linkedin.com/in/marcgalbraith/" }
  - { name: GitHub, url: "https://github.com/dogacid" }

sass:
  style: compressed

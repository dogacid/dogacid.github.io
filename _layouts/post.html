---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <time class="post-date" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
  </header>

  <div class="prose">
    {{ content }}
  </div>

  <p class="post-back"><a href="{{ '/' | relative_url }}">← All writing</a></p>
</article>
